method: searched
source: >-
  npm, PyPI, RubyGems and the GitHub org github.com/Umbra-Space, cross-checked against
  https://docs.canopy.umbra.space/docs/archive-catalog-developer-tooling
finding: >-
  Umbra publishes NO first-party client SDK for the Canopy API in any language. Its own developer
  tooling page recommends third-party open-source libraries instead. Two same-named PyPI packages
  were checked and explicitly ruled out as unrelated (see rejected below). No `SDKs` pointer is
  emitted in apis.yml, because there is no official client library to count.
packages: []
first_party_repositories:
- name: umbra-stac-extension
  url: https://github.com/Umbra-Space/umbra-stac-extension
  org: https://github.com/Umbra-Space
  description: STAC extension for Umbra — the umbra:* property vocabulary carried on STAC items
  kind: specification extension
  official: true
  note: >-
    Not a client library. It is the only public repository in Umbra's GitHub organization.
recommended_third_party_source: https://docs.canopy.umbra.space/docs/archive-catalog-developer-tooling
recommended_third_party_note: >-
  Recommended BY Umbra for consuming the Archive Catalog, but authored and maintained by others.
  official:false on every entry.
recommended_third_party:
- language: python
  registry: pypi
  name: pystac-client
  url: https://github.com/stac-utils/pystac-client
  install: pip install pystac-client
  official: false
  maintainer: stac-utils
  usage: >-
    Client.open("https://api.canopy.umbra.space/archive/", headers={"Authorization": f"Bearer
    {CANOPY_TOKEN}"}) then .search(collections=["umbra-sar"], intersects=..., datetime=...)
- language: python
  registry: pypi
  name: leafmap
  url: https://leafmap.org/
  install: pip install leafmap
  official: false
  usage: interactive Jupyter map for drawing search bounds and visualizing STAC results
rejected:
- registry: pypi
  name: umbra
  url: https://pypi.org/project/umbra/
  reason: >-
    Name collision. "Umbra is the main package of sIBL_GUI and sIBL_Reporter" by Thomas Mansencal
