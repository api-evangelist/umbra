- registry: github
  name: stapi-spec/stapi-fastapi-umbra
  url: https://github.com/stapi-spec/stapi-fastapi-umbra
  reason: >-
    A community STAPI (Satellite Tasking API) implementation that proxies to the Canopy API. Owned
