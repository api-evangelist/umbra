openapi: 3.1.0
info:
  title: Tiles
  description: Canopy API for map tiles and preview images
  version: 1.0.3
servers:
- url: https://api.canopy.umbra.space/tiles
paths:
  /cog/preview:
    get:
      tags:
      - Preview Image
      summary: Preview
      description: Create preview of a dataset.
      operationId: preview_cog_preview_get
      parameters:
      - name: format
        in: query
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/ImageType'
          title: Format
      - name: collect_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          description: Collect ID to render
          title: Collect Id
        description: Collect ID to render
      - name: bidx
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: integer
          - type: 'null'
          title: Band indexes
          description: Dataset band indexes
        description: Dataset band indexes
        examples:
          one-band:
            value:
            - 1
          multi-bands:
            value:
            - 1
            - 2
            - 3
      - name: expression
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Band Math expression
          description: rio-tiler's band math expression
        description: rio-tiler's band math expression
        examples:
          simple:
            description: Simple band math.
            value: b1/b2
          multi-bands:
            description: 'Semicolon (;) delimited expressions (band1: b1/b2, band2: b2+b3).'
            value: b1/b2;b2+b3
      - name: dst_crs
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Output Coordinate Reference System.
          title: Dst Crs
        description: Output Coordinate Reference System.
      - name: nodata
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: integer
          - type: number
          - type: 'null'
          title: Nodata value
          description: Overwrite internal Nodata value
        description: Overwrite internal Nodata value
      - name: unscale
        in: query
        required: false
        schema:
          type: boolean
          title: Apply internal Scale/Offset
          description: Apply internal Scale/Offset. Defaults to `False`.
          default: false
        description: Apply internal Scale/Offset. Defaults to `False`.
      - name: resampling
        in: query
        required: false
        schema:
          enum:
          - nearest
          - bilinear
          - cubic
          - cubic_spline
          - lanczos
          - average
          - mode
          - gauss
          - rms
          type: string
          description: RasterIO resampling algorithm. Defaults to `nearest`.
          default: nearest
          title: Resampling
        description: RasterIO resampling algorithm. Defaults to `nearest`.
      - name: reproject
        in: query
        required: false
        schema:
          enum:
          - nearest
          - bilinear
          - cubic
          - cubic_spline
          - lanczos
          - average
          - mode
          - sum
          - rms
          type: string
          description: WarpKernel resampling algorithm (only used when doing re-projection). Defaults to `nearest`.
          default: nearest
          title: Reproject
        description: WarpKernel resampling algorithm (only used when doing re-projection). Defaults to `nearest`.
      - name: max_size
        in: query
        required: false
        schema:
          type: integer
          default: 1024
          title: Max Size
      - name: height
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Height
      - name: width
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Width
      - name: algorithm
        in: query
        required: false
        schema:
          enum:
          - hillshade
          - contours
          - normalizedIndex
          - terrarium
          - terrainrgb
          type: string
          description: Algorithm name
          title: Algorithm
        description: Algorithm name
      - name: algorithm_params
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Algorithm parameter
          title: Algorithm Params
        description: Algorithm parameter
      - name: rescale
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Min/Max data Rescaling
          description: comma (',') delimited Min,Max range. Can set multiple time for multiple bands.
          examples:
          - 0,2000
          - 0,1000
          - 0,10000
        description: comma (',') delimited Min,Max range. Can set multiple time for multiple bands.
      - name: color_formula
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Color Formula
          description: 'rio-color formula (info: https://github.com/mapbox/rio-color)'
        description: 'rio-color formula (info: https://github.com/mapbox/rio-color)'
