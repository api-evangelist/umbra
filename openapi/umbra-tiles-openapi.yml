      responses:
        '200':
          description: Return an image.
          content:
            image/png: {}
            image/jpeg: {}
            image/jpg: {}
            image/webp: {}
            image/jp2: {}
            image/tiff; application=geotiff: {}
            application/x-binary: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ImageType:
      type: string
      enum:
      - png
      - npy
      - tif
      - jpeg
      - jpg
      - jp2
      - webp
      - pngraw
      title: ImageType
      description: Available Output image type.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- bearerAuth: []
