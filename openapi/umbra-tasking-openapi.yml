      - grazingAngleEndDegrees
      - targetAzimuthAngleStartDegrees
      - targetAzimuthAngleEndDegrees
      - squintAngleEngineeringDegreesStart
      - squintAngleEngineeringDegreesEnd
      - slantRangeStartKm
      - slantRangeEndKm
      - groundRangeStartKm
      - groundRangeEndKm
