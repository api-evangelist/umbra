openapi: 3.1.0
info:
  title: Tasking
  description: Canopy API for Self-Service Tasking
  version: 3.13.0
servers:
- url: https://api.canopy.umbra.space/tasking
  description: Live Environment
- url: https://api.canopy.prod.umbra-sandbox.space/tasking
  description: Sandbox Environment
paths:
  /tasks:
    post:
      tags:
      - Tasks
      summary: Create Task
      description: Creates a new task. New tasks begin with status ACTIVE, and should transition to SUBMITTED, or REJECTED
        within a few minutes. Query tasks by id for status updates.
      operationId: create_task
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommercialTaskRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/{id}/cancel:
    patch:
      tags:
      - Tasks
      summary: Cancel Task
      description: Requests cancellation of a previously submitted task. A task can only be canceled if it's status is one
        of SCHEDULED, SUBMITTED, ACCEPTED, ACTIVE. If this operation fails, a 422 will be returned.
      operationId: cancel_task
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/{id}:
    get:
      tags:
      - Tasks
      summary: Get Task
      operationId: get_task
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/search:
    post:
      tags:
      - Tasks
      summary: Post Search Tasks
      description: Search Tasks using a variety of available filters
      operationId: post_search_tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostSearchTasksRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFeatureCollection_Task_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/archive-tasks:
    post:
      tags:
      - Tasks
      summary: Archive Tasks
      operationId: create_archive_tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveResellRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveResellResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /feasibilities:
    post:
      tags:
      - Feasibility
      summary: Create Feasibility
      description: Creates a feasibility request for the given constraints. Feasibilities begin with status RECEIVED, and
        should transition to COMPLETED or ERROR within a few minutes. Poll feasibility by id until status is COMPLETED, upon
        which opportunities will also be returned.
      operationId: create_feasibility
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeasibilityRequest-Input'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feasibility'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /feasibilities/{id}:
    get:
      tags:
      - Feasibility
      summary: Get Feasibility
      description: Returns feasibility by id. When status is COMPLETED, the opportunities array will be populated with opportunities.
      operationId: get_feasibility
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feasibility'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /collects/{id}:
    get:
      tags:
      - Collects
      summary: Get Collect
      operationId: get_collect
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /collects/search:
    post:
      tags:
      - Collects
      summary: Post Search Collects
      description: Search Collects using a variety of available filters
      operationId: post_search_collects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostSearchCollectsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFeatureCollection_CollectResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /restricted-access-areas:
    get:
      tags:
      - Restricted Access Areas
      summary: Get Restricted Access Areas
      description: Returns a GeoJSON FeatureCollection of locations where Tasking is disallowed for your organization
      operationId: get_restricted_access_areas
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureCollection'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ArchiveResellFailureResponseItem:
      properties:
        collectId:
          type: string
          format: uuid
          title: Collectid
          description: UUID of the collect
        status:
          type: string
          title: Status
          description: Status of the resell request
        message:
          type: string
          title: Message
          description: Success or error message
      type: object
      required:
      - collectId
      - status
      - message
      title: ArchiveResellFailureResponseItem
    ArchiveResellRequest:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ArchiveResellRequestItem'
          type: array
          maxItems: 50
          minItems: 1
          title: Items
          description: Array of archive resell orders. Max of 50 per request
        targetContractId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Targetcontractid
          description: UUID of the contract for validation
      type: object
      required:
      - items
      title: ArchiveResellRequest
      description: Request model for public-facing archive resell requests
    ArchiveResellRequestItem:
      properties:
        collectId:
          type: string
          format: uuid
          title: Collectid
          description: UUID of the collect to resell
        productTypes:
          anyOf:
          - items:
              $ref: '#/components/schemas/ResellableTaskProductType'
            type: array
          - type: 'null'
          title: Producttypes
          description: Optional list of product types to deliver. If none provided, default products are used.
        deliveryConfigId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Deliveryconfigid
          description: Optional delivery config ID for the resell
        userOrderId:
          anyOf:
          - type: string
          - type: 'null'
          title: Userorderid
          description: Optional user-provided order identifier
        taskName:
          anyOf:
          - type: string
          - type: 'null'
          title: Taskname
          description: Name of the task. If none provided, a generic name will be auto-generated.
      type: object
      required:
      - collectId
      title: ArchiveResellRequestItem
      description: Request model for a single archive resell item
    ArchiveResellResponse:
      properties:
        results:
          items:
            anyOf:
            - $ref: '#/components/schemas/ArchiveResellSuccessResponseItem'
            - $ref: '#/components/schemas/ArchiveResellFailureResponseItem'
          type: array
          title: Results
          description: Results for each resell request
        targetContractId:
          type: string
          format: uuid
          title: Targetcontractid
          description: UUID of the resell contract
      type: object
      required:
      - results
      - targetContractId
      title: ArchiveResellResponse
      description: Response model for public-facing archive resell requests
    ArchiveResellSuccessResponseItem:
      properties:
        collectId:
          type: string
          format: uuid
          title: Collectid
          description: UUID of the collect
        taskId:
          type: string
          format: uuid
          title: Taskid
          description: UUID of the task
        resellId:
          type: string
          format: uuid
          title: Resellid
          description: UUID of the resell delivery that was created
        resellCollectId:
          type: string
          format: uuid
          title: Resellcollectid
          description: UUID of the resell collect
        resellCollectTaskId:
          type: string
          format: uuid
          title: Resellcollecttaskid
          description: UUID of the task associated with the resell collect
        deliveryConfigId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Deliveryconfigid
          description: Optional delivery config ID for the resell
        productTypes:
          items:
            $ref: '#/components/schemas/ResellableTaskProductType'
          type: array
          title: Producttypes
          description: Product types selected for resell
        userOrderId:
          anyOf:
          - type: string
          - type: 'null'
          title: Userorderid
          description: Optional user order id
        taskName:
          anyOf:
          - type: string
          - type: 'null'
          title: Taskname
          description: Optional task name
        status:
          type: string
          title: Status
          description: Status of the resell request
        message:
          type: string
          title: Message
          description: Success or error message
      type: object
      required:
      - collectId
      - taskId
      - resellId
      - resellCollectId
      - resellCollectTaskId
      - deliveryConfigId
      - productTypes
      - userOrderId
      - taskName
      - status
      - message
      title: ArchiveResellSuccessResponseItem
    BaseModel:
      properties: {}
      type: object
      title: BaseModel
    CollectResponse:
      properties:
        type:
          type: string
          title: Type
          default: Feature
        geometry:
          oneOf:
          - $ref: '#/components/schemas/Point'
          - $ref: '#/components/schemas/MultiPoint'
          - $ref: '#/components/schemas/LineString'
          - $ref: '#/components/schemas/MultiLineString'
          - $ref: '#/components/schemas/Polygon'
          - $ref: '#/components/schemas/MultiPolygon'
          - $ref: '#/components/schemas/GeometryCollection-Output'
          title: Geometry
          discriminator:
            propertyName: type
            mapping:
              GeometryCollection: '#/components/schemas/GeometryCollection-Output'
              LineString: '#/components/schemas/LineString'
              MultiLineString: '#/components/schemas/MultiLineString'
              MultiPoint: '#/components/schemas/MultiPoint'
              MultiPolygon: '#/components/schemas/MultiPolygon'
              Point: '#/components/schemas/Point'
              Polygon: '#/components/schemas/Polygon'
        archiveIds:
          items:
            type: string
            format: uuid
          type: array
          title: Archiveids
        id:
          type: string
          format: uuid
          title: Id
        properties:
          $ref: '#/components/schemas/CollectResponseProperties'
      type: object
      required:
      - geometry
      - id
      - properties
      title: CollectResponse
      description: Read only Collect model for responses
    CollectResponseProperties:
      properties:
        id:
          anyOf:
          - type: string
            format: uuid
          - type: integer
          - type: string
          title: Id
        createdAt:
          type: string
          format: date-time
          title: Createdat
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
        collectName:
          type: string
          title: Collectname
          description: Name for the collect, in the form of the vehicle the collect is tasked on - start date and time of
            the collect
        taskId:
          type: string
          format: uuid
          title: Taskid
          description: Maps to tasks, tasks may have more than one collect associated with it based on the type of task (e.g.
            mosaic or recurring types)
        satelliteId:
          type: string
          title: Satelliteid
          description: Vehicle to satisfy collect
        collectType:
          $ref: '#/components/schemas/CollectType'
          description: Imaging mode used for collect, e.g. 'SPOTLIGHT'
          default: SPOTLIGHT
        status:
          $ref: '#/components/schemas/CollectStatus'
          description: Current status of collect
        statusHistory:
          items:
            $ref: '#/components/schemas/CollectStatusEvent'
          type: array
          title: Statushistory
          description: The status history of the collect
        startAt:
          type: string
          format: date-time
          title: Startat
          description: Approximate time to start collect
        endAt:
          type: string
          format: date-time
          title: Endat
          description: Approximate time to end collect
        footprintSquareMeters:
          type: number
          title: Footprintsquaremeters
          description: Area in square meters of the collect geometry
        targetAzimuthAngleDegrees:
          anyOf:
          - type: number
          - type: 'null'
          title: Targetazimuthangledegrees
          description: The Target Azimuth angle is measured clockwise from north as measured at the target location. Approximate
            until the collect is CollectStatus.PROCESSED
        grazingAngleDegrees:
          anyOf:
          - type: number
          - type: 'null'
          title: Grazingangledegrees
          description: The Grazing Angle is the angle between the local tangent plane at the target location and the line
            of sight vector between the satellite and the target. Approximate until the collect is CollectStatus.PROCESSED
        incidenceAngleDegrees:
          anyOf:
          - type: number
          - type: 'null'
          title: Incidenceangledegrees
          description: The Incidence Angle is 90° - Grazing Angle. Approximate until the collect is CollectStatus.PROCESSED
        squintAngleEngineeringDegrees:
          anyOf:
          - type: number
          - type: 'null'
          title: Squintangleengineeringdegrees
          description: '"Squinted" refers to how far away from broadside the angle is. Since exactly broadside is either 90
            or -90 degrees, the proximity of the angle to 0 degrees suggests the satellite is further “squinted” forward for
            collection. In contrast, closeness to 180 or -180 degrees indicates being further “squinted” backward.  Approximate
            until the collect is CollectStatus.PROCESSED. Learn more at: https://docs.canopy.umbra.space/docs/squint'
        squintAngleDegrees:
          anyOf:
          - type: number
          - type: 'null'
          title: Squintangledegrees
          description: 'The Squint Angle is measured in the local horizontal plane at the satellite location and has the range
            (-180, 180]. It is the angle between 90° clockwise the direction of travel of the asset and the projection of
            the line of sight vector into this plane. Approximate until the collect is CollectStatus.PROCESSED. Note that
            this field will soon be DEPRECATED. Please use squintAngleEngineeringDegrees. Read more at: https://docs.canopy.umbra.space/docs/squint'
        squintAngleExploitationDegrees:
          anyOf:
          - type: number
          - type: 'null'
          title: Squintangleexploitationdegrees
          description: 'Earth surface angle between the cross-track vector and the ground range arc. Learn more at: https://docs.canopy.umbra.space/docs/squint'
        squintAngleDegreesOffBroadside:
          anyOf:
          - type: number
          - type: 'null'
          title: Squintangledegreesoffbroadside
          description: 'Calculated looking at the squint angle relative to its nearest broadside value (-90 or 90 degrees)
            and computing the difference, yielding the "degrees off broadside" value. Learn more at: https://docs.canopy.umbra.space/docs/squint'
        slantRangeKilometers:
          anyOf:
          - type: number
          - type: 'null'
          title: Slantrangekilometers
          description: The Slant Range is the straight line distance between the target location and the satellite. Approximate
            until the collect is CollectStatus.PROCESSED
        polarization:
          anyOf:
          - $ref: '#/components/schemas/PolarizationEnum'
          - type: 'null'
          description: Polarization refers to the orientation of the wave as it is transmitted or how it is filtered upon
            receive.
        azimuthResolutionMinMeters:
          anyOf:
          - type: number
          - type: 'null'
          title: Azimuthresolutionminmeters
          description: Minimum azimuth resolution in processed images
        rangeResolutionMinMeters:
          anyOf:
          - type: number
          - type: 'null'
          title: Rangeresolutionminmeters
          description: Minimum range resolution in processed images
        multilookFactor:
          type: integer
          title: Multilookfactor
          description: Azimuth looks
          default: 1
        organizationId:
          type: string
          title: Organizationid
          description: Collect Organization ID
        taskName:
          type: string
          title: Taskname
          description: Name of the task for this collect
          default: ''
        taskType:
          $ref: '#/components/schemas/TaskType'
          description: Type of task associated with this collect
        userOrderId:
          anyOf:
          - type: string
          - type: 'null'
          title: Userorderid
          description: User order ID associated with the task for this collect
      type: object
      required:
      - id
      - collectName
      - taskId
      - satelliteId
      - status
      - startAt
      - endAt
      - footprintSquareMeters
      - organizationId
      - taskType
      title: CollectResponseProperties
    CollectStatus:
      type: string
      enum:
      - ACTIVE
      - SCHEDULED
      - COMMANDED
      - COLLECTED
      - DOWNLINKED
      - INCOMPLETE
      - CORRUPT
      - STAGED
      - QUEUED
      - PROCESSING
      - PROCESSING_DELAY
      - PROCESSED
      - SUPERSEDED
      - FAILED
      - CANCELED
      - STALLED
      - UNKNOWN_COLLECT_STATUS
      - PARSED
      - ASSEMBLED
      - TRANSMITTED
      - DELIVERED
      - DELIVERING
      - DELIVERY_STALLED
      - DELIVERY_DELAYED
      - DELIVERY_ERROR
      title: Collect Status
      description: See https://docs.canopy.umbra.space/docs/tasking#collect-status for details.
    CollectStatusEvent:
      properties:
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        status:
          $ref: '#/components/schemas/CollectStatus'
        message:
          type: string
          title: Message
          default: ''
      type: object
      required:
      - timestamp
      - status
      title: CollectStatusEvent
    CollectType:
      type: string
      enum:
      - SPOTLIGHT
      - CUSTOM
      - DYNAMIC_STRIPMAP
      title: Collect Type
      description: The Collect Type. This generally maps to Task.ImagingMode.
    CommercialTaskRequest:
      properties:
        constraints:
          oneOf:
          - $ref: '#/components/schemas/ScanConstraints'
          - $ref: '#/components/schemas/SpotlightConstraints'
          title: Constraints
        windowStartAt:
          type: string
          format: date-time
          title: Windowstartat
        windowEndAt:
          type: string
          format: date-time
          title: Windowendat
        contractId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Contractid
          description: Explicit contract chosen for feasibility; if omitted default contract is used
        imagingMode:
          anyOf:
          - $ref: '#/components/schemas/ImagingMode'
          - type: 'null'
          description: The 'imagingMode' property is deprecated. It is now derived from the 'constraints' property.
          deprecated: true
        scanConstraints:
          anyOf:
          - $ref: '#/components/schemas/ScanConstraints'
          - type: 'null'
          description: The 'scanConstraints' property is deprecated. Use 'constraints' instead.
          deprecated: true
        spotlightConstraints:
          anyOf:
          - $ref: '#/components/schemas/SpotlightConstraints'
          - type: 'null'
          description: The 'spotlightConstraints' property is deprecated. Use 'constraints' instead.
          deprecated: true
        deliveryConfigId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Deliveryconfigid
        productTypes:
          anyOf:
          - items:
              $ref: '#/components/schemas/TaskProductType'
            type: array
          - type: 'null'
          title: Producttypes
          description: Products delivered to the customer. GEC will always be among delivered products, even if not requested
            directly. If None, all allowed products for your organization will be delivered.
        tags:
          items:
            type: string
            maxLength: 255
            minLength: 1
            pattern: ^[a-zA-Z0-9_-]+$
          type: array
          maxItems: 20
          minItems: 0
          title: Tags
          description: Tags are a set of labels that can be applied to Tasks. Tags are repeatable and can be used across multiple
            Tasks, allowing customers to categorize, search, and filter their orders effectively.
        taskName:
          type: string
          minLength: 1
          title: Taskname
        userOrderId:
          type: string
          title: Userorderid
          default: ''
        satelliteIds:
          items:
            type: string
          type: array
          title: Satelliteids
          description: List of satellites to limit the requested task to. If empty, all applicable satellites for the requesting
            organization will be considered to fulfill the task. For available satellite ids, see https://docs.canopy.umbra.space/docs/umbra-satellites.
      type: object
      required:
      - constraints
      - windowStartAt
      - windowEndAt
      - taskName
      title: CommercialTaskRequest
      deprecationWarning: Having additional properties is deprecated and will be forbidden in the future.
    Context:
      properties:
        limit:
          type: integer
          title: Limit
        matched:
          type: integer
          title: Matched
        returned:
          type: integer
          title: Returned
      type: object
      required:
      - limit
      - matched
      - returned
      title: Context
      description: Contextual information provided to API consumers
    Contract:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        organizationId:
          type: string
          title: Organizationid
        constellationMinWindowHours:
          type: integer
          title: Constellationminwindowhours
        constellationPriority:
          type: integer
          minimum: 0
          title: Constellationpriority
        precisionPriority:
          type: integer
          minimum: 0
          title: Precisionpriority
        lockedPriority:
          type: integer
          minimum: 0
          title: Lockedpriority
        deramp:
          $ref: '#/components/schemas/Deramp'
        assignedRevs:
          items:
            type: integer
            maximum: 9
            minimum: 0
          type: array
          uniqueItems: true
          title: Assignedrevs
          description: Set of revs assigned to this contract; contracts have exclusive access over their region for revs they
            are assigned.
        allowedSatellites:
          items:
            type: string
          type: array
          title: Allowedsatellites
        allowedProducts:
          items:
            $ref: '#/components/schemas/TaskProductType'
          type: array
          title: Allowedproducts
        defaultProducts:
          items:
            $ref: '#/components/schemas/TaskProductType'
          type: array
          title: Defaultproducts
        allowedBlacklynxSatelliteIds:
          items:
            type: string
          type: array
          title: Allowedblacklynxsatelliteids
          readOnly: true
        allowedSystemNames:
          items:
            type: string
          type: array
          title: Allowedsystemnames
          readOnly: true
      additionalProperties: true
      type: object
      required:
      - id
      - organizationId
      - taskTier
      - constellationMinWindowHours
      - constellationPriority
      - precisionPriority
      - lockedPriority
      - deramp
      - allowedSatellites
      - allowedProducts
      - defaultProducts
      - allowedBlacklynxSatelliteIds
      - allowedSystemNames
      title: Contract
      description: 'Contract model for Canopy Admin /contracts/{contract_id} response.


        Here we define only a subset of fields on the contract that are relevant for commercial

        tasking''s purposes. We allow extra fields since Processing relies on a snapshot of the contract

        saved on the Task and we don''t want to have to frequently update the model to account for fields

        that are not directly relevant to this service.'
    Deramp:
      type: string
      enum:
      - AUTO
      - 'OFF'
      title: Deramp
    Feasibility:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        createdAt:
          type: string
          format: date-time
          title: Createdat
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
        opportunities:
          anyOf:
          - items:
              $ref: '#/components/schemas/Opportunity'
            type: array
          - type: 'null'
          title: Opportunities
        feasibilityRequest:
          anyOf:
          - $ref: '#/components/schemas/FeasibilityRequest-Output'
          - type: 'null'
        organizationId:
          type: string
          title: Organizationid
        status:
