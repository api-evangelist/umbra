          - type: string
            format: uuid
          - type: 'null'
          title: Bulktaskid
      type: object
      required:
      - geometry
      - properties
      title: Task
      description: 'A reservation for an Opportunity that will generate one or more Collects


        It is not necessary to first generate an Opportunity. A Task can be specified

        with a broad window which allows the Umbra scheduler to automatically

        determine when to place the Task.'
    TaskProductType:
      type: string
      enum:
      - CPHD
      - GEC
      - SIDD
      - SICD
      - DI_GIF
      - DI_TIF
      - CRSD
      title: TaskProductType
      description: See https://docs.canopy.umbra.space/docs/delivered-product-types for details.
    TaskProperties:
      properties:
        createdAt:
          type: string
          format: date-time
          title: Createdat
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
        organizationId:
          type: string
          title: Organizationid
        status:
          $ref: '#/components/schemas/TaskStatus'
          default: RECEIVED
        statusHistory:
          items:
            $ref: '#/components/schemas/TaskStatusHistory'
          type: array
          title: Statushistory
        userId:
          type: string
          title: Userid
        collectIds:
          items:
            type: string
            format: uuid
          type: array
          title: Collectids
        userEmail:
          anyOf:
          - type: string
          - type: 'null'
          title: Useremail
        contractId:
          type: string
          format: uuid
          title: Contractid
          description: Contract ID associated with this task
        taskType:
          anyOf:
          - $ref: '#/components/schemas/TaskType'
          - type: 'null'
        acceptableWindowStartAt:
          type: string
          format: date-time
          title: Acceptablewindowstartat
        acceptableWindowEndAt:
          type: string
          format: date-time
          title: Acceptablewindowendat
        deliveryConfigId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Deliveryconfigid
        productTypes:
          anyOf:
          - items:
              $ref: '#/components/schemas/TaskProductType'
            type: array
          - type: 'null'
          title: Producttypes
          description: Products delivered to the customer. GEC will always be among delivered products, even if not requested
            directly. If None, all allowed products for your organization will be delivered.
        tags:
          items:
            type: string
            maxLength: 255
            minLength: 1
            pattern: ^[a-zA-Z0-9_-]+$
          type: array
          maxItems: 20
          minItems: 0
          title: Tags
          description: Tags are a set of labels that can be applied to Tasks. Tags are repeatable and can be used across multiple
            Tasks, allowing customers to categorize, search, and filter their orders effectively.
        taskName:
          type: string
          minLength: 1
          title: Taskname
        userOrderId:
          type: string
          title: Userorderid
          default: ''
        satelliteIds:
          items:
            type: string
          type: array
          title: Satelliteids
          description: List of satellites to limit the requested task to. If empty, all applicable satellites for the requesting
            organization will be considered to fulfill the task. For available satellite ids, see https://docs.canopy.umbra.space/docs/umbra-satellites.
        constraints:
          anyOf:
          - $ref: '#/components/schemas/SpotlightConstraintsResponse'
          - $ref: '#/components/schemas/ScanConstraintsResponse'
          title: Constraints
        windowStartAt:
          type: string
          format: date-time
          title: Windowstartat
        windowEndAt:
          type: string
          format: date-time
          title: Windowendat
        spotlightConstraints:
          anyOf:
          - $ref: '#/components/schemas/SpotlightConstraintsResponse'
          - type: 'null'
          description: The 'spotlightConstraints' property is deprecated. Use 'constraints' instead.
          deprecated: true
        scanConstraints:
          anyOf:
          - $ref: '#/components/schemas/ScanConstraintsResponse'
          - type: 'null'
          description: The 'scanConstraints' property is deprecated. Use 'constraints' instead.
          deprecated: true
        contractSnapshot:
          anyOf:
          - $ref: '#/components/schemas/Contract'
          - type: 'null'
          description: The state of the organization's contract at the time of task creation
        imagingMode:
          $ref: '#/components/schemas/ImagingMode'
          description: The 'imagingMode' property is deprecated. Use 'constraints.imagingMode' instead.
          deprecated: true
          readOnly: true
      type: object
      required:
      - organizationId
      - userId
      - contractId
      - acceptableWindowStartAt
      - acceptableWindowEndAt
      - taskName
      - constraints
      - windowStartAt
      - windowEndAt
      - contractSnapshot
      - imagingMode
