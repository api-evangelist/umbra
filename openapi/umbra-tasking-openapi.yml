          anyOf:
          - type: number
          - type: 'null'
          title: Squintangleenddegrees
          description: The ending squint angle in degrees. This is a legacy field that uses "Umbra Squint" (or right broadside
            squint).
          deprecated: true
        squintAngleEngineeringDegreesStart:
          type: number
          title: Squintangleengineeringdegreesstart
          description: 'Starting squint angle. "Squinted" refers to how far away from broadside the angle is. Since exactly
            broadside is either 90 or -90 degrees, the proximity of the angle to 0 degrees suggests the satellite is further
            “squinted” forward for collection. In contrast, closeness to 180 or -180 degrees indicates being further “squinted”
            backward.  Approximate until the collect is PROCESSED. Learn more at: https://docs.canopy.umbra.space/docs/squint'
        squintAngleEngineeringDegreesEnd:
          type: number
          title: Squintangleengineeringdegreesend
          description: 'Ending squint angle. "Squinted" refers to how far away from broadside the angle is. Since exactly
            broadside is either 90 or -90 degrees, the proximity of the angle to 0 degrees suggests the satellite is further
            “squinted” forward for collection. In contrast, closeness to 180 or -180 degrees indicates being further “squinted”
            backward.  Approximate until the collect is PROCESSED. Learn more at: https://docs.canopy.umbra.space/docs/squint'
