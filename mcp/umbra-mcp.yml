  read_only: true
- name: get-server-variables
  description: Gets the server variables for each server within a specific OpenAPI spec.
  input_required: [title]
  read_only: true
- name: execute-request
  description: Executes an API request with a given HAR request object.
  input_required: [harRequest, title]
  read_only: false
  note: >-
    The only write-capable tool. It executes against the live Canopy API, so the caller must supply
    its own Bearer token in the HAR request; the MCP server itself holds no Canopy credential.
