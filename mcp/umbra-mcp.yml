tools:
- name: list-specs
  description: Lists all available OpenAPI specs. Use the title to select a spec.
  input_required: []
  read_only: true
- name: list-endpoints
  description: >-
    Lists all API paths and their HTTP methods with summaries, organized by path. Results can be
    passed directly into 'get-endpoint'.
  input_required: [title]
  read_only: true
- name: search-endpoints
  description: >-
    Performs a deep search through paths, operations, and parameters to discover relevant API
