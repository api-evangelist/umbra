gap:
  observation: >-
    Every Canopy capability is reachable by an agent, but only through a generic HAR-shaped
    invoker. There are zero named, semantically-typed Canopy tools (no create_task tool, no
    search_archive tool), so an agent gets no typed affordance for the operations that actually
    matter and must do two round-trips (get-endpoint, then execute-request) per call. A
    first-party Canopy MCP server with named tools over the tasking and archive-search flows is
    the clear next step — this is Umbra's to build, not ours to model.
