source: mcp/umbra-mcp-tools-list.json + the six documents in openapi/
summary: >-
  Umbra's MCP server is a documentation-platform server over the Canopy OpenAPI documents, not a
  per-resource tool surface. That makes this crosswalk unusual: no MCP tool binds to a single REST
  operationId. Five of six tools are META tools that read the specs themselves, and the sixth
  (execute-request) is a UNIVERSAL binding that can invoke any of the 37 published operations when
  the caller supplies a HAR request and its own Bearer token. Recorded honestly rather than forced
  into one-tool-per-operation rows that do not exist.
