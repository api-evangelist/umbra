mcp_only:
- tool: list-specs
  reason: >-
    Meta tool over the spec catalog itself. Its REST analogue is the RFC 9727 api-catalog document
    at https://docs.canopy.umbra.space/.well-known/api-catalog (saved at
    well-known/umbra-api-catalog.json), which is a discovery document rather than a Canopy API
    operation.
- tool: list-endpoints
  reason: Meta tool that enumerates paths within one OpenAPI document; no backing Canopy operation.
- tool: search-endpoints
  reason: >-
    Meta tool performing full-text search across paths, operations and parameters of the specs.
    Canopy publishes no search-the-API operation; this exists only on the documentation surface.
- tool: get-endpoint
  reason: >-
    Meta tool returning one operation's detail including security schemes and servers; the
    equivalent for a REST client is reading openapi/ directly.
- tool: get-server-variables
  reason: >-
    Meta tool reading servers[] variables out of a spec. Canopy's servers[] carry no templated
    variables, so this returns an empty result for all six documents.
