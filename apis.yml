apis:
- aid: umbra:tasking
  name: Umbra Canopy Tasking API
  description: 'Canopy API for self-service tasking of Umbra''s SAR satellite constellation. Create feasibility
    requests to discover collection opportunities for a target, submit Tasks in Spotlight, Dwell or Scan imaging
    modes, cancel Tasks, search Tasks and Collects, order archive Tasks, and retrieve the GeoJSON FeatureCollection
    of restricted access areas where tasking is disallowed for your organization.'
  humanURL: https://docs.canopy.umbra.space/docs/tasking
  baseURL: https://api.canopy.umbra.space/tasking
  tags:
  - Tasking
  - Feasibility
  - Collects
  - Synthetic Aperture Radar
  - Satellite Imagery
  properties:
  - type: OpenAPI
    url: openapi/umbra-tasking-openapi.yml
  - type: Documentation
    url: https://docs.canopy.umbra.space/docs/tasking
  - type: APIReference
    url: https://docs.canopy.umbra.space/reference/create_task
  - type: Overlay
    url: overlays/umbra-tasking-overlay.yaml
- aid: umbra:stac-api-v2
  name: Umbra Canopy STAC API v2
  description: 'Spec-compliant SpatioTemporal Asset Catalog (STAC) API v2 over the Collects an organization has
    tasked. Implements the STAC API Item Search Specification and the STAC API Filter Extension, with simple GET
    and advanced POST search, collection listing, and single-item retrieval. STAC item assets include signed URLs
    when the number of items returned is below a threshold.'
  humanURL: https://docs.canopy.umbra.space/reference/v2-stac-overview
  baseURL: https://api.canopy.umbra.space/v2/stac
  tags:
  - STAC
  - Search
  - Geospatial
  - Satellite Imagery
  properties:
  - type: OpenAPI
    url: openapi/umbra-stac-api-v2-openapi.yml
  - type: Documentation
    url: https://docs.canopy.umbra.space/docs/migrate-to-stac-api-v2
  - type: Overlay
    url: overlays/umbra-stac-api-v2-overlay.yaml
- aid: umbra:stac-archive
  name: Umbra Canopy Archive Catalog (STAC) API
  description: 'STAC API over Umbra''s Archive Catalog of previously collected SAR imagery. Supports simple and
    advanced item search with the STAC API Filter Extension, collection listing and retrieval, single-item lookup,
    and thumbnail retrieval by archive id. Commonly consumed with pystac-client and leafmap.'
  humanURL: https://docs.canopy.umbra.space/docs/archive-catalog-searching-via-stac-api
  baseURL: https://api.canopy.umbra.space/archive
  tags:
  - STAC
  - Archive
  - Search
  - Geospatial
  properties:
  - type: OpenAPI
    url: openapi/umbra-stac-archive-openapi.yml
  - type: Documentation
    url: https://docs.canopy.umbra.space/docs/using-the-archive-catalog
  - type: Overlay
    url: overlays/umbra-stac-archive-overlay.yaml
- aid: umbra:delivery
  name: Umbra Canopy Delivery API
  description: 'Canopy API for delivery of Umbra customer data. Create, list, delete and verify DeliveryConfigs
    that push collected SAR products directly into a customer-owned AWS S3 or Google Cloud Storage bucket, and
    retrieve the Collect metadata JSON schema.'
  humanURL: https://docs.canopy.umbra.space/docs/delivery-configs
  baseURL: https://api.canopy.umbra.space/delivery
  tags:
  - Delivery
  - Storage
  - Configuration
  properties:
  - type: OpenAPI
    url: openapi/umbra-delivery-openapi.yml
  - type: Documentation
    url: https://docs.canopy.umbra.space/docs/delivery-configs
  - type: Overlay
    url: overlays/umbra-delivery-overlay.yaml
- aid: umbra:admin
  name: Umbra Canopy Admin API
  description: 'Canopy Admin API for machine-to-machine token management and organization configuration. Create,
    read, rotate and delete the organization''s OAuth2 client credentials, read organization settings, and resolve
    the product constraints that apply to a contract or to the organization default.'
  humanURL: https://docs.canopy.umbra.space/docs/authentication-via-client-credentials
  baseURL: https://api.canopy.umbra.space/admin
  tags:
