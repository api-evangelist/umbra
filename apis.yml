aid: umbra
name: Umbra
description: 'Umbra is an American space technology company operating a constellation of commercial synthetic
  aperture radar (SAR) satellites capable of sub-25cm resolution imaging, day or night and through cloud cover.
  Its Canopy platform gives customers self-service access to the constellation through both a web application
  and a public REST API: customers calculate tasking feasibility against targets of interest, submit Tasks to
  collect new imagery in Spotlight, Dwell or Scan imaging modes, track Task and Collect status through the full
  collection-downlink-processing-delivery lifecycle, search a STAC-compliant archive catalog of existing imagery,
  and configure direct data delivery into their own AWS S3 or Google Cloud Storage buckets. Umbra licenses its
  imagery under CC BY 4.0, publishes open pricing, and runs an open data program.'
url: https://raw.githubusercontent.com/api-evangelist/umbra/refs/heads/main/apis.yml
