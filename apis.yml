    url: openapi/umbra-admin-openapi.yml
  - type: Documentation
    url: https://docs.canopy.umbra.space/docs/authentication-via-client-credentials
  - type: Overlay
    url: overlays/umbra-admin-overlay.yaml
- aid: umbra:tiles
  name: Umbra Canopy Tiles API
  description: 'Canopy API for map tiles and preview images. Generates a preview of a cloud-optimized GeoTIFF
    (COG) dataset for display in map and imagery viewers.'
  humanURL: https://docs.canopy.umbra.space/reference/preview_cog_preview_get
