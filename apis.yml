- aid: umbra:docs-mcp
  name: Umbra Canopy Documentation MCP Server
  description: 'Anonymous, hosted Model Context Protocol server published by Umbra on the Canopy documentation
    host. Exposes six tools that let an agent enumerate the Canopy OpenAPI specs, list and search endpoints,
    retrieve full endpoint detail including security schemes and servers, read server variables, and execute a
    request against the live Canopy API when the agent supplies its own credentials.'
  humanURL: https://docs.canopy.umbra.space/
