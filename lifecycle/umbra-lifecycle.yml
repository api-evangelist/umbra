versioning:
  scheme: semver
  spec: https://semver.org/
  current_major: '1'
  default_when_unspecified: MAJOR version 1
  in_url: false
  policy:
  - Backwards compatible within a MAJOR version.
  - Backwards-compatible feature additions and behavior changes ship in MINOR releases.
  - Non-breaking bug fixes ship in PATCH releases.
  - Breaking changes ship only in MAJOR releases.
  docs: https://docs.canopy.umbra.space/docs/versioning-policy
support_window:
  policy: >-
    Umbra supports at minimum the two most recent MAJOR versions of the Canopy API.
  source: https://docs.canopy.umbra.space/docs/versioning-policy
deprecation:
  policy_url: https://docs.canopy.umbra.space/docs/versioning-policy
  policy: >-
    Umbra states it will make all attempts to avoid introducing breaking changes, will notify users
    of upcoming MAJOR releases via the documentation and standard support channels, and will
    provide a clear deprecation timeline as part of those notifications.
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    The policy is prose only. No Sunset or Deprecation response header (RFC 8594) is documented,
    and no operation in any of the six OpenAPI documents carries `deprecated: true` — so a client
    cannot detect deprecation programmatically.
  announced_deprecations:
