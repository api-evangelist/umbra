- date: '2024-12-20'
  url: https://docs.canopy.umbra.space/changelog/2024-12-20
  breaking: true
  changed:
  - The Archive Catalog API at https://api.canopy.umbra.space/archive now uses the standard rate
    limiting rules
  security:
  - The Archive Catalog API at https://api.canopy.umbra.space/archive now REQUIRES authentication
  note: >-
    Flagged breaking here because previously-anonymous archive access began requiring a bearer
    token. Umbra filed it under Changed/Security rather than announcing it as a MAJOR release.
- date: '2024-07-17'
  url: https://docs.canopy.umbra.space/changelog/2024-07-17
  breaking: false
  added:
  - New Task.tags field on create_task
  - New endpoint returning product constraints per imaging mode (Get Products)
  - Natural Footprint scene size on create_task and create_feasibility
  - New tasking product types — CSI SIDD, CSI TIFF, DI GIF
